<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340" fill="none">
  <style>
    .bg { fill: #040f0b; stroke: #1e2925; }
    .card { fill: #08150f; stroke: #2d3d37; }
    .card-accent { fill: #061811; stroke: #06b680; }
    .card-kernel { fill: #06131c; stroke: #0298fe; }
    .pill { fill: #0d1d17; stroke: #2d3d37; }
    .pill-green { fill: #062b1f; stroke: #00ff93; }
    .pill-blue { fill: #082238; stroke: #0298fe; }
    .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .subtitle { fill: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    .muted { fill: rgba(255, 255, 255, 0.65); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .mono { fill: #00ff93; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    .mono-blue { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    .connector { stroke: #2d3d37; stroke-dasharray: 4 3; }
    .connector-solid { stroke: #00ff93; }
    .dot-green { fill: #00ff93; }
    .dot-blue { fill: #0298fe; }
  </style>

  <!-- Outer Frame -->
  <rect class="bg" x="4" y="4" width="912" height="332" rx="4" stroke-width="1.5"/>

