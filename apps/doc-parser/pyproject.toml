[project]
name = "heurion-doc-parser"
version = "0.1.0"
description = "Heurion 2.0 本地 PDF 结构化解析服务（Docling）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "docling>=2.40.0,<3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "pypdfium2>=4.30.0",
    "onnxruntime>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "reportlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
