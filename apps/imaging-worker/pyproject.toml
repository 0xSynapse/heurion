[project]
name = "heurion-imaging-worker"
version = "0.1.0"
description = "Heurion 2.0 Medical Imaging & MONAI Inference Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "torch>=2.2.0",
    "monai>=1.3.0",
    "pydicom>=2.4.0",
    "python-gdcm>=3.0.24",
    "nibabel>=5.2.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "scipy>=1.12.0",
    "python-multipart>=0.0.32",
    "einops>=0.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
