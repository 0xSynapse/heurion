name: 诊断生产邮件服务

on:
  workflow_dispatch:
    inputs:
      test_recipient:
        description: '测试收件邮箱'
        required: true
        default: 'zhaojimmy13@gmail.com'

jobs:
  diagnose:
    name: 诊断 Resend 与 VPS 邮件发送日志
    runs-on: ubuntu-latest
    if: github.repository == '0xaicrypto/heurion'
    steps:
      - uses: actions/checkout@v7
      - name: 启动 SSH Agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

      - name: 1. 检查 Resend API 域名与配置状态
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo "=== 检查 Resend 域名状态 ==="
          curl -sS -X GET "https://api.resend.com/domains" \
            -H "Authorization: Bearer $RESEND_API_KEY" | jq .

          echo "=== 检查 Resend API Key 权限 ==="
          curl -sS -X GET "https://api.resend.com/api-keys" \
            -H "Authorization: Bearer $RESEND_API_KEY" | jq .

      - name: 2. 检查 VPS 上 heurion2 最近邮件数据库记录与容器日志
        env:
          HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=no"
          echo "=== 最近 10 条邮件记录 (SQLite) ==="
          $SSH "$HOST" "docker exec heurion2 node --input-type=module -e '
            import { DatabaseSync } from \"node:sqlite\";
            const db = new DatabaseSync(\"/app/data/platform/platform.db\");
            const rows = db.prepare(\"SELECT id, user_id, sender, sender_name, recipient, subject, folder, delivery_status, delivery_note, created_at FROM mail_messages ORDER BY created_at DESC LIMIT 10\").all();
            console.log(JSON.stringify(rows, null, 2));
          '" || true

          echo "=== 自动清理之前误落入收件箱的外网邮箱记录 ==="
          $SSH "$HOST" "docker exec heurion2 node --input-type=module -e '
            import { DatabaseSync } from \"node:sqlite\";
            const db = new DatabaseSync(\"/app/data/platform/platform.db\");
            const res = db.prepare(\"DELETE FROM mail_messages WHERE folder = ? AND (recipient LIKE ? OR recipient LIKE ? OR recipient LIKE ?)\").run(\"inbox\", \"%@gmail.com\", \"%@163.com\", \"%@qq.com\");
            console.log(\"已清理误投递至收件箱的外部邮件条数:\", res.changes);
          '" || true

          echo "=== 容器中关于 mail 的最近日志 ==="
          $SSH "$HOST" "docker logs --tail 100 heurion2 2>&1 | grep -iE 'mail|resend|smtp' || true"

      - name: 3. 测试直接调用 Resend API 发送一封测试邮件
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT: ${{ github.event.inputs.test_recipient }}
        run: |
          echo "=== 尝试通过 Resend 发送邮件 (From: Heurion 临床工作站 <no-reply@heurion.org>) ==="
          RES=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Heurion 临床工作站 <no-reply@heurion.org>\",
              \"to\": [\"$RECIPIENT\"],
              \"subject\": \"【Heurion 生产环境发信测试】诊断测试\",
              \"text\": \"这是一封来自 Heurion 生产环境的直接 API 诊断测试邮件。如果您收到此邮件，说明 Resend 发信通道已畅通。\"
            }")
          echo "$RES"

          echo "=== 尝试通过 Resend 发送邮件 (From: Dr. Zhao <zhaohui@heurion.org>) ==="
          RES2=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Dr. Zhao <zhaohui@heurion.org>\",
              \"to\": [\"$RECIPIENT\"],
              \"subject\": \"【Heurion 生产环境发信测试】医生个人前缀测试\",
              \"text\": \"这是一封测试 zhaohui@heurion.org 发件地址的邮件。\"
            }")
          echo "$RES2"
