name: Heurion 在线探测

# 外部探测 heurion.org：每 10 分钟查一次 /healthz 与首页，连续两次失败开一个 issue（订阅仓库的人会收到邮件），
# 恢复后自动关闭。GitHub 的定时任务只在默认分支（main）上运行。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository_id == '1301746811'
    runs-on: ubuntu-latest
    steps:
      - name: 探测
        id: probe
        run: |
          ok=0
          for i in 1 2; do
            if curl -fsS -m 20 https://heurion.org/healthz | grep -q '"ok":true' && curl -fsS -m 20 -o /dev/null https://heurion.org/ && curl -fsS -m 20 -o /dev/null https://heurion.org/app; then ok=1; break; fi
            sleep 60
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "healthz: $(curl -s -m 20 -o /dev/null -w '%{http_code}' https://heurion.org/healthz)" >> "$GITHUB_STEP_SUMMARY"
      - name: 开 / 关告警 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OK: ${{ steps.probe.outputs.ok }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="heurion.org 不可用"
          EXISTING=$(gh issue list --repo "$REPO" --state open --label uptime --json number,title --jq ".[] | select(.title | contains(\"$TITLE\")) | .number" | head -n1)
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ "$OK" != "1" ] && [ -z "$EXISTING" ]; then
            gh issue create --repo "$REPO" --title "🔴 $TITLE" --label uptime \
              --body "连续两次探测失败（/healthz 或首页）。时间：$NOW
          运行：$RUN_URL"
          elif [ "$OK" = "1" ] && [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "✅ 已恢复：$NOW"
            gh issue close "$EXISTING" --repo "$REPO"
          fi
