name: Deploy Heurion 2.0

# 2.0 代码在 0xSynapse/heurion 的 main 分支（2026-10-04 起；1.0 归档为 v1-archive 分支与 v1-final 标签）；部署到 /opt/heurion2。
# 第一次部署会自动切换（停 1.0、全量备份、导入账户），失败自动恢复 1.0；清理 1.0 用 cleanup-v1.yml（手动）。
# 生产部署流水线：仅在 0xSynapse/heurion（原 0xaicrypto/heurion，2026-10 账户改名）上执行（持有全部生产密钥与 VPS 部署权限）。
# 按仓库 ID 判断而不按名字：账户或仓库改名后条件不会悄悄变假、所有任务被跳过（改名后曾因此停止部署）
# 公开开源仓库 heurion-org/heurion 仅同步开源代码，由 ci.yml 运行测试，不进行镜像发布与现网部署
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# 与 1.0 的 Deploy Server 共用并发组：同一台机器上不能同时部署
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/0xsynapse/heurion2
  EMBEDDER_IMAGE: ghcr.io/0xsynapse/heurion2-embedder
  IMAGING_WORKER_IMAGE: ghcr.io/0xsynapse/heurion2-imaging-worker
  DOC_PARSER_IMAGE: ghcr.io/0xsynapse/heurion2-doc-parser
  VIEWER_IMAGE: ghcr.io/0xsynapse/heurion2-viewer

jobs:
  test:
    name: 类型检查与测试
    if: github.repository_id == '1301746811'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: '12.5.1' }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }
      # 资料库测试用 poppler 的 pdftotext
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 数据集导入测试真实运行 Python 脚本（与镜像里 /opt/compute 同一组读表的包）
      - run: python3 -m venv .venv-compute && .venv-compute/bin/pip install --quiet pandas openpyxl pyreadstat
      - run: pnpm test

  images:
    name: 构建镜像
    if: github.repository_id == '1301746811'
    needs: [test]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: 平台镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ steps.vars.outputs.sha }},${{ env.APP_IMAGE }}:latest
          cache-from: |
            type=registry,ref=${{ env.APP_IMAGE }}:latest
            type=gha,scope=app
          cache-to: |
            type=inline
            type=gha,mode=min,scope=app
      - name: 嵌入服务镜像（含 bge-m3 模型）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/embedder/Dockerfile
          push: true
          tags: ${{ env.EMBEDDER_IMAGE }}:${{ steps.vars.outputs.sha }},${{ env.EMBEDDER_IMAGE }}:latest
          cache-from: |
            type=registry,ref=${{ env.EMBEDDER_IMAGE }}:latest
            type=gha,scope=embedder
          cache-to: |
            type=inline
            type=gha,mode=min,scope=embedder
      - name: 医学影像 Worker 镜像（MONAI + PyTorch CPU）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/imaging-worker/Dockerfile
          push: true
          tags: ${{ env.IMAGING_WORKER_IMAGE }}:${{ steps.vars.outputs.sha }},${{ env.IMAGING_WORKER_IMAGE }}:latest
          cache-from: |
            type=registry,ref=${{ env.IMAGING_WORKER_IMAGE }}:latest
            type=gha,scope=imaging
          cache-to: |
            type=inline
            type=gha,mode=min,scope=imaging
      - name: PDF 解析服务镜像（Docling，构建期下载模型）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/doc-parser/Dockerfile
          push: true
          tags: ${{ env.DOC_PARSER_IMAGE }}:${{ steps.vars.outputs.sha }},${{ env.DOC_PARSER_IMAGE }}:latest
          cache-from: |
            type=registry,ref=${{ env.DOC_PARSER_IMAGE }}:latest
            type=gha,scope=doc-parser
          cache-to: |
            type=inline
            type=gha,mode=min,scope=doc-parser

  # 阅片器（OHIF，deploy/viewer/build.sh 从源码构建，单次约 15–25 分钟）：单独一个 job，与上面的 4 个镜像并行，也不和它们抢 runner 磁盘。
  # 避免每次重建：按 deploy/viewer 下受版本控制文件的内容（git 的 blob 哈希，含 build.sh 里的 OHIF 版本号）算一个指纹，
  # 推一个 src-<指纹> 标签。GHCR 里已有这个标签就只给它加 <sha> 与 latest 标签（服务端操作，不拉层、不构建）；
  # 没有才真正构建。没用 GHA 缓存当主手段：GHA 缓存每仓库 10 GB、按 LRU 淘汰，和另外 4 个大镜像共用，命中不可靠。
  # 真要重建时再用 registry 上的 buildcache（mode=max，含构建阶段的依赖安装层）加速，不占 GHA 缓存额度。
  viewer:
    name: 阅片器镜像
    if: github.repository_id == '1301746811'
    needs: [test]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "src=src-$(git ls-files -s deploy/viewer | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: cached
        name: 查找同一份源码已构建的镜像
        run: |
          if docker buildx imagetools inspect "${VIEWER_IMAGE}:${{ steps.vars.outputs.src }}" >/dev/null 2>&1; then
            echo "hit=1" >> "$GITHUB_OUTPUT"; echo "deploy/viewer 没有变化：复用 ${{ steps.vars.outputs.src }}"
          else
            echo "hit=0" >> "$GITHUB_OUTPUT"; echo "deploy/viewer 有变化（或第一次）：从源码构建"
          fi
      - name: 复用：加 <sha> 与 latest 标签
        if: steps.cached.outputs.hit == '1'
        run: docker buildx imagetools create -t "${VIEWER_IMAGE}:${{ steps.vars.outputs.sha }}" -t "${VIEWER_IMAGE}:latest" "${VIEWER_IMAGE}:${{ steps.vars.outputs.src }}"
      - name: 准备 OHIF 源码与 Heurion 配置、扩展
        if: steps.cached.outputs.hit != '1'
        run: VIEWER_PREPARE_ONLY=1 sh deploy/viewer/build.sh
      - name: 构建阅片器镜像
        if: steps.cached.outputs.hit != '1'
        uses: docker/build-push-action@v7
        with:
          context: deploy/viewer/.ohif-src
          file: deploy/viewer/.ohif-src/Dockerfile
          build-args: |
            PUBLIC_URL=/
            APP_CONFIG=config/heurion.js
          push: true
          tags: ${{ env.VIEWER_IMAGE }}:${{ steps.vars.outputs.src }},${{ env.VIEWER_IMAGE }}:${{ steps.vars.outputs.sha }},${{ env.VIEWER_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.VIEWER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.VIEWER_IMAGE }}:buildcache,mode=max

  deploy:
    name: 部署到生产
    if: github.repository_id == '1301746811'
    needs: [images, viewer]
    runs-on: ubuntu-latest
    environment: { name: production, url: 'https://heurion.org' }
    steps:
      - uses: actions/checkout@v7
      - name: 启动 SSH Agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      - name: 生成 .env.production
        env:
          HEURION_SECRET: ${{ secrets.HEURION2_SECRET || secrets.SERVER_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          # 影像存储与阅片器（docs/DEPLOY.md「启用影像存储（pacs）」）：仓库变量 ENABLE_PACS=1 时启用
          ENABLE_PACS: ${{ vars.ENABLE_PACS }}
          ORTHANC_PASSWORD: ${{ secrets.ORTHANC_PASSWORD }}
          IMAGING_RETENTION_DAYS: ${{ vars.IMAGING_RETENTION_DAYS }}
        run: |
          # 缺关键 secret 直接失败，不带默认值上线
          for v in HEURION_SECRET DEEPSEEK_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::缺少 secret：$v"; exit 1; }
          done
          umask 077
          cat > /tmp/heurion2.env <<EOF
          HOSTNAME=heurion.org
          HEURION_SECRET=${HEURION_SECRET}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM=Heurion <no-reply@heurion.org>
          NCBI_API_KEY=${NCBI_API_KEY}
          CONTACT_EMAIL=no-reply@heurion.org
          S3_ENDPOINT=${S3_ENDPOINT}
          S3_REGION=${S3_REGION}
          S3_BUCKET=${S3_BUCKET}
          S3_ACCESS_KEY=${S3_ACCESS_KEY}
          S3_SECRET_KEY=${S3_SECRET_KEY}
          MAIL_DOMAIN=heurion.org
          MAIL_INBOUND_SECRET=${HEURION_SECRET}
          EOF
          sed -i 's/^ *//' /tmp/heurion2.env
          # 影像存储（pacs profile）：不启用时一行都不写，与之前完全一致
          case "${ENABLE_PACS:-}" in
            1|true|TRUE|yes) PACS=1 ;;
            ''|0|false|FALSE|no) PACS=0 ;;
            *) echo "::error::仓库变量 ENABLE_PACS 只能是 1 / true（启用）或留空 / 0（不启用）：$ENABLE_PACS"; exit 1 ;;
          esac
          if [ "$PACS" = 1 ]; then
            # 不生成、不兜底弱口令：口令必须由人设成 secret（openssl rand -hex 32）。字符集限定，避免破坏 Orthanc 的 JSON 配置与 .env 解析
            [ -n "$ORTHANC_PASSWORD" ] || { echo "::error::ENABLE_PACS 已启用但缺少 secret ORTHANC_PASSWORD（用 openssl rand -hex 32 生成后设为仓库 secret）"; exit 1; }
            printf '%s' "$ORTHANC_PASSWORD" | grep -Eq '^[A-Za-z0-9_-]{32,128}$' \
              || { echo "::error::secret ORTHANC_PASSWORD 须为 32–128 位字母、数字、- 或 _（建议 openssl rand -hex 32）"; exit 1; }
            # 生产保留期默认 180 天（云端只是工作副本，原件在医院）；仓库变量 IMAGING_RETENTION_DAYS 可改，0 = 不清理
            DAYS="${IMAGING_RETENTION_DAYS:-180}"
            printf '%s' "$DAYS" | grep -Eq '^[0-9]{1,5}$' || { echo "::error::仓库变量 IMAGING_RETENTION_DAYS 须为不小于 0 的整数：$DAYS"; exit 1; }
            HOST_NAME=$(sed -n 's/^HOSTNAME=//p' /tmp/heurion2.env)
            {
              echo "COMPOSE_PROFILES=pacs"
              echo "ORTHANC_URL=http://orthanc:8042"
              echo "ORTHANC_USER=heurion"
              echo "ORTHANC_PASSWORD=${ORTHANC_PASSWORD}"
              echo "VIEWER_URL=http://viewer:8080"
              echo "VIEWER_HOST=viewer.${HOST_NAME}"
              echo "VIEWER_SITE=viewer.${HOST_NAME}"
              echo "IMAGING_RETENTION_DAYS=${DAYS}"
            } >> /tmp/heurion2.env
            echo "影像存储：启用（阅片器 viewer.${HOST_NAME}，原件保留 ${DAYS} 天）"
          fi
      - name: 拷贝部署文件并部署
        env:
          HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SHA: ${{ needs.images.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15"
          # 部署前强力清理 VPS 磁盘：清理已退出容器、历史镜像缓存、systemd 日志与废弃数据，确保有充足空间解压大层
          $SSH "$HOST" "
            echo '== [VPS Pre-deploy] 检查与清理 VPS 磁盘空间 =='
            df -h /
            docker container prune -f >/dev/null 2>&1 || true
            docker image prune -af >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
            docker network prune -f >/dev/null 2>&1 || true
            if command -v journalctl >/dev/null 2>&1; then journalctl --vacuum-size=100M >/dev/null 2>&1 || true; fi
            apt-get clean >/dev/null 2>&1 || true
            rm -rf /tmp/docker-* /tmp/extract-* 2>/dev/null || true
            if [ -f /opt/heurion2/.cutover-done ]; then
              rm -rf /opt/heurion /opt/nexus-embedding-models /opt/heurion2/backups/v1-final-* 2>/dev/null || true
              docker volume ls -q 2>/dev/null | grep -E '^heurion_' | xargs -r docker volume rm 2>/dev/null || true
            fi
            echo '== [VPS Pre-deploy] 清理后可用空间 =='
            df -h /
          "
          $SSH "$HOST" "mkdir -p /opt/heurion2/scripts"
          scp -o StrictHostKeyChecking=no deploy/docker-compose.yml deploy/Caddyfile "$HOST":/opt/heurion2/
          scp -o StrictHostKeyChecking=no deploy/deploy.sh deploy/cutover-v1.sh deploy/backup-to-s3.sh deploy/cleanup-v1.sh deploy/pacs-check.sh "$HOST":/opt/heurion2/scripts/
          scp -o StrictHostKeyChecking=no /tmp/heurion2.env "$HOST":/opt/heurion2/.env.production
          # 镜像是私有包：本次部署用 GITHUB_TOKEN 登录 GHCR 拉取
          echo "$GHCR_TOKEN" | $SSH "$HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "$HOST" "cd /opt/heurion2 && chmod 600 .env.production && chmod +x scripts/*.sh && \
            HEURION2_IMAGE=${APP_IMAGE}:${SHA} EMBEDDER_IMAGE=${EMBEDDER_IMAGE}:${SHA} IMAGING_WORKER_IMAGE=${IMAGING_WORKER_IMAGE}:${SHA} DOC_PARSER_IMAGE=${DOC_PARSER_IMAGE}:${SHA} VIEWER_IMAGE=${VIEWER_IMAGE}:${SHA} bash scripts/deploy.sh"
      - name: AI 代码隔离自检（容器里以两个测试 uid 尝试读密钥、数据库、别人的工作区）
        env:
          HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: ssh -o StrictHostKeyChecking=no "$HOST" "docker exec -u node heurion2 bash /app/deploy/sandbox/probe.sh"
      - name: 冒烟检查
        env:
          HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          ENABLE_PACS: ${{ vars.ENABLE_PACS }}
        run: |
          curl -fsS https://heurion.org/healthz
          curl -fsS https://heurion.org/ | grep -q 'CLINICAL AI WORKSTATION'
          curl -fsS https://heurion.org/site/site.css >/dev/null
          curl -fsS https://heurion.org/app | grep -q 'id="page"'
          # MCP 不对外
          [ "$(curl -s -o /dev/null -w '%{http_code}' https://heurion.org/mcp)" = "404" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST https://heurion.org/llm/v1/messages)" = "404" ]
          # 影像存储（启用 pacs 时）
          case "${ENABLE_PACS:-}" in 1|true|TRUE|yes) ;; *) exit 0 ;; esac
          # 匿名访问 /api/me 不暴露 features 等信息
          [ "$(curl -s -o /dev/null -w '%{http_code}' https://heurion.org/api/me)" = "401" ]
          # 阅片器子域名可达：没有阅片 Cookie 时 DICOMweb 返回 401，主站接口在这里不存在（404）
          [ "$(curl -s -o /dev/null -w '%{http_code}' https://viewer.heurion.org/api/dicomweb/studies)" = "401" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' https://viewer.heurion.org/api/me)" = "404" ]
          # 容器在跑；平台带口令能连 Orthanc、不带口令被拒（401）；平台能取到阅片器静态页（deploy/pacs-check.sh）
          ssh -o StrictHostKeyChecking=no "$HOST" "bash /opt/heurion2/scripts/pacs-check.sh"
      - name: 清 Cloudflare 缓存
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          [ -n "$CF_TOKEN" ] && [ -n "$ZONE_ID" ] || { echo "没有 CF 凭据，跳过"; exit 0; }
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"purge_everything":true}' | grep -q '"success":true'
