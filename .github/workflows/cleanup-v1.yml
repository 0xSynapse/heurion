name: Cleanup Heurion 1.0

# 切换到 2.0 并确认无误后手动运行：删除 1.0 的容器、卷、镜像与 /opt/heurion，停掉执行面 worker VPS。
# 不可恢复（只剩切换前的全量备份：/opt/heurion2/backups 与 S3 heurion2/v1-final/）。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DELETE-V1 确认删除 1.0'
        required: true

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository_id == '1301746811'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 确认
        run: '[ "${{ inputs.confirm }}" = "DELETE-V1" ] || { echo "::error::需要输入 DELETE-V1"; exit 1; }'
      - name: 启动主 VPS SSH Agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      - name: 清理主 VPS 上的 1.0
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "CONFIRM=DELETE-V1 bash /opt/heurion2/scripts/cleanup-v1.sh"
      - name: 加载 Worker VPS SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WORKER_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      - name: 停掉执行面 worker VPS（2.0 的计算在平台容器里的 dsh）
        env:
          WORKER_HOST: ${{ secrets.WORKER_VPS_HOST }}
          WORKER_USER: ${{ secrets.WORKER_VPS_USER || secrets.VPS_USER }}
        run: |
          [ -n "$WORKER_HOST" ] || { echo "没有 WORKER_VPS_HOST，跳过"; exit 0; }
          # compose 文件里的镜像标签变量必须有值，否则 down 直接报错（2026-10-03 第一次运行就卡在这）；
          # 最后列出剩下的容器，结果可核对
          ssh -o StrictHostKeyChecking=no "$WORKER_USER@$WORKER_HOST" '
            set -u
            if [ -f /opt/heurion-worker/docker-compose.worker.yml ]; then
              cd /opt/heurion-worker && WORKER_IMAGE_TAG=none docker compose -f docker-compose.worker.yml down --remove-orphans || echo "compose down 失败，改为逐个删除"
            fi
            ids=$(docker ps -aq --filter name=heurion-worker); [ -z "$ids" ] || docker rm -f $ids
            echo "== worker 上剩下的容器："; docker ps -a --format "{{.Names}}\t{{.Status}}"
          '
