name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 类型检查与测试
    # 在公开仓库始终运行 CI 校验；在私有仓库 push main 时由 deploy-v2 统一运行，避免重复消耗 runner
    if: github.repository != '0xaicrypto/heurion' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: '12.5.1' }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: python3 -m venv .venv-compute && .venv-compute/bin/pip install --quiet pandas openpyxl pyreadstat
      - run: pnpm test
