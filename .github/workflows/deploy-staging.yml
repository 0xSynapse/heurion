name: Deploy Staging

# 预发环境：手动触发，构建镜像并部署到预发服务器（STAGING_HOST，域名 staging.heurion.org）。
# 用来在不影响生产（deploy-v2.yml，只由 main 触发）的前提下走通整条 CI → 镜像 → 部署 → 自检流程。
# 与生产的区别：
#   - 镜像只打 commit sha 标签，不移动 latest；
#   - 独立的 HEURION_SECRET（STAGING_HEURION_SECRET），数据与生产完全隔离；
#   - 不配 S3：预发不做备份，也不会写进生产的备份目录；
#   - 默认不发邮件（只读 STAGING_RESEND_API_KEY，不设时平台发信直接报错）；
#   - 不清 Cloudflare 缓存（预发域名不走 Cloudflare 代理）。
# 预发服务器以后要转为生产时，先 `docker compose -p heurion2 down -v` 清掉预发的卷，再恢复生产数据。
# 2026-10-13 起原预发服务器转为生产，预发只能手动触发（Actions → Deploy Staging → Run workflow），
# 且 STAGING_HOST 必须指向一台不跑生产的机器，否则会用预发配置覆盖生产。
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/0xsynapse/heurion2
  EMBEDDER_IMAGE: ghcr.io/0xsynapse/heurion2-embedder
  IMAGING_WORKER_IMAGE: ghcr.io/0xsynapse/heurion2-imaging-worker
  DOC_PARSER_IMAGE: ghcr.io/0xsynapse/heurion2-doc-parser
  STAGING_HOSTNAME: staging.heurion.org

jobs:
  test:
    name: 类型检查与测试
    if: github.repository_id == '1301746811'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: '12.5.1' }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }
      # 资料库测试用 poppler 的 pdftotext
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 数据集导入测试真实运行 Python 脚本（与镜像里 /opt/compute 同一组读表的包）
      - run: python3 -m venv .venv-compute && .venv-compute/bin/pip install --quiet pandas openpyxl pyreadstat
      - run: pnpm test

  images:
    name: 构建镜像
    if: github.repository_id == '1301746811'
    needs: [test]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: 平台镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ steps.vars.outputs.sha }}
          cache-from: |
            type=registry,ref=${{ env.APP_IMAGE }}:latest
            type=gha,scope=app
          cache-to: |
            type=inline
            type=gha,mode=min,scope=app
      - name: 嵌入服务镜像（含 bge-m3 模型）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/embedder/Dockerfile
          push: true
          tags: ${{ env.EMBEDDER_IMAGE }}:${{ steps.vars.outputs.sha }}
          cache-from: |
            type=registry,ref=${{ env.EMBEDDER_IMAGE }}:latest
            type=gha,scope=embedder
          cache-to: |
            type=inline
            type=gha,mode=min,scope=embedder
      - name: 医学影像 Worker 镜像（MONAI + PyTorch CPU）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/imaging-worker/Dockerfile
          push: true
          tags: ${{ env.IMAGING_WORKER_IMAGE }}:${{ steps.vars.outputs.sha }}
          cache-from: |
            type=registry,ref=${{ env.IMAGING_WORKER_IMAGE }}:latest
            type=gha,scope=imaging
          cache-to: |
            type=inline
            type=gha,mode=min,scope=imaging
      - name: PDF 解析服务镜像（Docling，构建期下载模型）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/doc-parser/Dockerfile
          push: true
          tags: ${{ env.DOC_PARSER_IMAGE }}:${{ steps.vars.outputs.sha }}
          cache-from: |
            type=registry,ref=${{ env.DOC_PARSER_IMAGE }}:latest
            type=gha,scope=doc-parser
          cache-to: |
            type=inline
            type=gha,mode=min,scope=doc-parser

  deploy:
    name: 部署到预发
    if: github.repository_id == '1301746811'
    needs: [images]
    runs-on: ubuntu-latest
    environment: { name: staging, url: 'https://staging.heurion.org' }
    steps:
      - uses: actions/checkout@v7
      - name: 启动 SSH Agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      - name: 固定服务器指纹
        env:
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::缺少 secret：STAGING_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: 生成 .env.production
        env:
          HEURION_SECRET: ${{ secrets.STAGING_HEURION_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 预发可能载有生产数据的副本：默认不配发信（STAGING_RESEND_API_KEY 不设），避免真实用户收到预发发出的邮件
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          for v in HEURION_SECRET DEEPSEEK_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::缺少 secret：$v"; exit 1; }
          done
          umask 077
          cat > /tmp/heurion2.env <<EOF
          HOSTNAME=${STAGING_HOSTNAME}
          HEURION_SECRET=${HEURION_SECRET}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM=Heurion Staging <no-reply@heurion.org>
          NCBI_API_KEY=${NCBI_API_KEY}
          CONTACT_EMAIL=no-reply@heurion.org
          MAIL_DOMAIN=heurion.org
          MAIL_INBOUND_SECRET=${HEURION_SECRET}
          EOF
          sed -i 's/^ *//' /tmp/heurion2.env
      - name: 拷贝部署文件并部署
        env:
          HOST: ${{ secrets.STAGING_USER || 'root' }}@${{ secrets.STAGING_HOST }}
          SHA: ${{ needs.images.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -o ServerAliveInterval=15"
          $SSH "$HOST" "mkdir -p /opt/heurion2/scripts"
          scp deploy/docker-compose.yml deploy/Caddyfile "$HOST":/opt/heurion2/
          scp deploy/deploy.sh deploy/cutover-v1.sh deploy/backup-to-s3.sh deploy/cleanup-v1.sh "$HOST":/opt/heurion2/scripts/
          scp /tmp/heurion2.env "$HOST":/opt/heurion2/.env.production
          echo "$GHCR_TOKEN" | $SSH "$HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "$HOST" "cd /opt/heurion2 && chmod 600 .env.production && chmod +x scripts/*.sh && \
            HEURION2_IMAGE=${APP_IMAGE}:${SHA} EMBEDDER_IMAGE=${EMBEDDER_IMAGE}:${SHA} IMAGING_WORKER_IMAGE=${IMAGING_WORKER_IMAGE}:${SHA} DOC_PARSER_IMAGE=${DOC_PARSER_IMAGE}:${SHA} bash scripts/deploy.sh"
      - name: AI 代码隔离自检（容器里以两个测试 uid 尝试读密钥、数据库、别人的工作区）
        env:
          HOST: ${{ secrets.STAGING_USER || 'root' }}@${{ secrets.STAGING_HOST }}
        run: ssh "$HOST" "docker exec -u node heurion2 bash /app/deploy/sandbox/probe.sh"
      - name: 冒烟检查
        run: |
          B=https://${STAGING_HOSTNAME}
          curl -fsS $B/healthz
          curl -fsS $B/ | grep -q 'CLINICAL AI WORKSTATION'
          curl -fsS $B/site/site.css >/dev/null
          curl -fsS $B/app | grep -q 'id="page"'
          # MCP 与模型代理不对外
          [ "$(curl -s -o /dev/null -w '%{http_code}' $B/mcp)" = "404" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/llm/v1/messages)" = "404" ]
