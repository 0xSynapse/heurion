name: 部署 Cloudflare 邮件路由 Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'deploy/cloudflare/**'

permissions:
  contents: read

jobs:
  deploy:
    name: 部署 Email Worker 到 Cloudflare
    runs-on: ubuntu-latest
    if: github.repository == '0xaicrypto/heurion'
    steps:
      - uses: actions/checkout@v7

      - name: 部署 Worker 到 Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          workingDirectory: 'deploy/cloudflare'
          secrets: |
            MAIL_INBOUND_SECRET
        env:
          MAIL_INBOUND_SECRET: ${{ secrets.HEURION2_SECRET || secrets.SERVER_SECRET }}

      - name: 自动配置 Email Routing Catch-all 规则 (Cloudflare API)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$ZONE_ID" ]; then
            echo "缺少 CF_API_TOKEN 或 CF_ZONE_ID，跳过自动配置路由规则"
            exit 0
          fi

          echo "确保 Cloudflare Email Routing 已开启并自动配置 MX 记录..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/enable" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" || true

          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/dns" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" || true

          echo "查询并尝试更新 Cloudflare Email Routing Catch-all 规则..."
          RES=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/email/routing/rules/catch_all" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"actions":[{"type":"worker","value":["heurion-inbound-mail"]}],"matchers":[{"type":"all"}],"enabled":true,"name":"Heurion Inbound Catch-all"}')
          
          echo "Cloudflare Email Routing 规则配置响应: $RES"
