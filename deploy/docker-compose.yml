# Heurion 2.0 生产部署（单机 Docker Compose）。
#   heurion2  平台（编辑器页面 + REST/SSE + 协同 WebSocket + MCP + 每用户 dsh 子进程 + LibreOffice 渲染）
#   embedder  本地嵌入服务（bge-m3，模型在镜像里），只在内部网络可达
#   doc-parser  PDF 结构化解析（Docling，模型在镜像里），只接入无外网的 internal 网络
#   caddy     反向代理 + 自动 HTTPS（Let's Encrypt），唯一对外暴露 80/443 的容器
# 由 deploy.sh 用 `docker compose -p heurion2 --env-file .env.production` 调用。
#
# 内存预算（2026-10-13 起的生产服务器；换机器时按新机器的内存与核数重新分配）：
# 各服务 mem_limit 合计约 34 GB，给系统、Docker、页缓存留约 30 GB。memswap_limit 等于 mem_limit，即不用 swap：
# 超过上限就是真的异常（泄漏、超大输入），宁可让容器重启也不拖慢整机。
#   服务            mem_limit  实测峰值（2026-10-13，macOS 进程 RSS，Linux 容器里会有出入）
#   heurion2        8g         空闲 0.2 GB；每个活跃用户的 dsh 进程约 0.2 GB、LibreOffice 渲染约 0.4 GB、统计 Python 按需
#   embedder        4g         稳定 0.8 GB；加载模型和批量嵌入时瞬时 2.4 GB
#   imaging-worker  16g        胸部 CT 分析峰值 3.06 GB；全身分割与更大的体积留足余量
#   doc-parser      6g         开公式识别后空闲约 1.1 GB；含扫描页 PDF 峰值约 3 GB 以上
#   caddy           256m       约 30–50 MB
# CPU：影像 6 线程、PDF 解析 4 线程，其余给平台和嵌入服务。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"
    tag: "{{.Name}}"

services:
  heurion2:
    image: ${HEURION2_IMAGE:-heurion2:latest}
    container_name: heurion2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 8g
    memswap_limit: 8g
    # AI 代码出站白名单（入口用 iptables 只放行本机平台端口）
    cap_add: [NET_ADMIN]
    env_file: [.env.production]
    environment:
      - NODE_ENV=production
      - HEURION_DEV_MODE=0
      - HEURION_DATA_DIR=/app/data
      - PORT=8787
      - EMBEDDING_URL=http://embedder:8003
      - IMAGING_WORKER_URL=http://imaging-worker:8004
      - DOC_PARSER_URL=http://doc-parser:8005
    volumes:
      # 平台数据：SQLite（文档、版本、评论、资料库、记忆、账户）、用户工作区、渲染缓存、OCR 语言模型
      - data:/app/data
    depends_on:
      embedder:
        condition: service_started
      imaging-worker:
        condition: service_started
      # 只等容器启动，不等预热：预热完成前平台的 PDF 导入自动走 poppler 兜底
      doc-parser:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [web, parser]

  embedder:
    image: ${EMBEDDER_IMAGE:-heurion2-embedder:latest}
    container_name: heurion2-embedder
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    memswap_limit: 4g
    networks: [web]
    # 不映射端口：只给平台用（嵌入服务没起来时平台退回关键词检索）

  imaging-worker:
    image: ${IMAGING_WORKER_IMAGE:-heurion2-imaging-worker:latest}
    container_name: heurion2-imaging-worker
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 16g
    memswap_limit: 16g
    environment:
      - PORT=8004
      - OMP_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - OPENBLAS_NUM_THREADS=6
      - HEURION_MODEL_DIR=/app/models
    volumes:
      - imaging-models:/app/models
    networks: [web]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    # 不映射端口：只在内部网络给平台与 MCP 代理调用

  doc-parser:
    image: ${DOC_PARSER_IMAGE:-heurion2-doc-parser:latest}
    container_name: heurion2-doc-parser
    restart: unless-stopped
    logging: *default-logging
    # 公式识别开启（模型在镜像里）；内存数字见文件开头的预算表
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - DOC_PARSER_FORMULA=1
      # 分段解析：每段 2 页，长文档的峰值不再随页数增长（实测 16 页：不分段 3.5 GB，分段 3.1 GB）
      - DOC_PARSER_PAGE_CHUNK=2
      # glibc 每线程内存池限制为 2 个，减少碎片；服务每次解析后还会 malloc_trim 归还内存
      - MALLOC_ARENA_MAX=2
      - DOC_PARSER_HOST=0.0.0.0
      - DOC_PARSER_PORT=8005
      - DOC_PARSER_THREADS=4
      - OMP_NUM_THREADS=4
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    # 只接入 internal 网络：没有出网路由，文档内容在网络层面就发不出去；也不映射端口
    networks: [parser]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    container_name: heurion2-caddy
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - HOSTNAME=${HOSTNAME}
    # /aegis-cloud/* 转发到宿主机上的 aegis-os 守护进程
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [heurion2]
    networks: [web]

volumes:
  data:
  caddy-data:
  caddy-config:
  imaging-models:

networks:
  web:
    driver: bridge
  # 平台 ↔ doc-parser 专用：internal 网络没有默认网关，容器无法访问外网
  parser:
    driver: bridge
    internal: true
