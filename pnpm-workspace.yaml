packages:
  - apps/*
  - packages/*
# dsh 的原生组件（子进程启动器 / pty / FFI）与 esbuild 需要执行安装脚本
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false
  # onnxruntime-node 的安装脚本只下载 CUDA 扩展（CPU 版二进制已在包里）；tesseract.js 的只是打印赞助信息
  onnxruntime-node: false
  tesseract.js: false
patchedDependencies:
  '@deepseek-ai/dsh-attachment-local@0.2.1-rc.2': patches/@deepseek-ai__dsh-attachment-local@0.2.1-rc.2.patch
# 安全修复：把传递依赖抬到已修复版本（对应 Dependabot / pnpm audit 告警；只选发布满两周的版本）
# 注：undici@>=8.0.0 <8.12.3 -> 8.12.3（2026-10-19 发布）与 zod@>=4.0.0 <4.6.6 -> 4.6.6（2026-10-08 发布）
# 需在宿主机（非 seatbelt 沙箱）执行 pnpm install --lockfile-only 同步更新 pnpm-lock.yaml 后启用。
overrides:
  '@modelcontextprotocol/client@>=2.0.0 <2.3.0': 2.3.0
  'fflate@>=0.8.0 <0.8.3': 0.8.3
  'ip-address@<10.7.4': 10.7.4
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
