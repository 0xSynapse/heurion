packages:
  - apps/*
  - packages/*
# dsh 的原生组件（子进程启动器 / pty / FFI）与 esbuild 需要执行安装脚本
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false
  # onnxruntime-node 的安装脚本只下载 CUDA 扩展（CPU 版二进制已在包里）；tesseract.js 的只是打印赞助信息
  onnxruntime-node: false
  tesseract.js: false
patchedDependencies:
  '@deepseek-ai/dsh-attachment-local@0.2.0-rc.2': patches/@deepseek-ai__dsh-attachment-local@0.2.0-rc.2.patch
